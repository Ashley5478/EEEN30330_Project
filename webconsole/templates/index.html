<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rainer · Connect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0b0f0e;
      --panel:     #111714;
      --border:    #1f3028;
      --green:     #2eff8a;
      --green-dim: #1a8a4d;
      --red:       #ff4a4a;
      --text:      #c8e8d4;
      --muted:     #4d7060;
      --font-mono: 'Share Tech Mono', monospace;
      --font-ui:   'Rajdhani', sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* subtle scanline overlay */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 2px,
        rgba(0,0,0,.12) 2px, rgba(0,0,0,.12) 4px
      );
      pointer-events: none;
      z-index: 100;
    }

    .card {
      width: min(420px, 90vw);
      border: 1px solid var(--border);
      background: var(--panel);
      padding: 2.5rem 2rem;
      position: relative;
      box-shadow: 0 0 60px rgba(46,255,138,.05);
    }

    .card::before {
      content: '';
      position: absolute;
      top: -1px; left: 2rem; right: 2rem;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--green), transparent);
    }

    .logo-row {
      display: flex;
      align-items: center;
      gap: .75rem;
      margin-bottom: 2rem;
    }

    .logo-icon {
      width: 36px; height: 36px;
      border: 2px solid var(--green);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: var(--green);
      font-size: 1.1rem;
      animation: pulse 3s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(46,255,138,.4); }
      50%       { box-shadow: 0 0 0 8px rgba(46,255,138,0); }
    }

    .logo-text { font-size: 1.6rem; font-weight: 700; letter-spacing: .15em; color: var(--green); }
    .logo-sub  { font-family: var(--font-mono); font-size: .65rem; color: var(--muted); margin-top: .1rem; }

    label {
      display: block;
      font-family: var(--font-mono);
      font-size: .7rem;
      color: var(--muted);
      letter-spacing: .12em;
      margin-bottom: .4rem;
    }

    input {
      width: 100%;
      background: #0b0f0e;
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: .95rem;
      padding: .6rem .85rem;
      outline: none;
      transition: border-color .2s;
      margin-bottom: 1.1rem;
      -webkit-appearance: none;
    }

    input:focus { border-color: var(--green-dim); }

    .row { display: flex; gap: .75rem; }
    .row input { flex: 1; }
    .row .port { max-width: 110px; }

    .btn {
      width: 100%;
      padding: .75rem;
      background: transparent;
      border: 1px solid var(--green);
      color: var(--green);
      font-family: var(--font-ui);
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: .15em;
      cursor: pointer;
      transition: background .2s, color .2s;
      position: relative;
      overflow: hidden;
    }

    .btn::after {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      width: 0; height: 0;
      background: rgba(46,255,138,.15);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: width .4s, height .4s, opacity .4s;
      opacity: 0;
    }

    .btn:hover { background: rgba(46,255,138,.08); }
    .btn:active::after { width: 300px; height: 300px; opacity: 1; }

    .error-box {
      background: rgba(255,74,74,.08);
      border: 1px solid rgba(255,74,74,.3);
      color: var(--red);
      font-family: var(--font-mono);
      font-size: .8rem;
      padding: .65rem .85rem;
      margin-bottom: 1.2rem;
      line-height: 1.5;
    }

    .error-box::before { content: '✗  '; }

    .tip {
      font-family: var(--font-mono);
      font-size: .68rem;
      color: var(--muted);
      text-align: center;
      margin-top: 1.5rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-row">
      <div class="logo-icon">⬡</div>
      <div>
        <div class="logo-text">RAINER</div>
        <div class="logo-sub">DEVICE CONTROL INTERFACE</div>
      </div>
    </div>

    {% if error %}
    <div class="error-box">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/connect">
      <div class="row">
        <div style="flex:1">
          <label>DEVICE HOST / IP</label>
          <input type="text" name="host" placeholder="192.168.1.x"
                 value="{{ host or '' }}" autocomplete="off" required />
        </div>
        <div class="port">
          <label>PORT</label>
          <input type="number" name="port" placeholder="5254"
                 value="{{ port or '' }}" min="1" max="65535" required />
        </div>
      </div>
      <button class="btn" type="submit">CONNECT →</button>
    </form>

    <p class="tip">Establishes a TLS connection with challenge-response auth</p>
  </div>
</body>
</html>
